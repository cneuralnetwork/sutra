<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Sutra — AI coding agent for the terminal</title>
  <desc id="desc">Sutra logo, tagline, and a connected inspect, edit, test workflow.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#1D3040"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="137" y1="0" x2="1143" y2="0"><stop stop-color="#F5B84B"/><stop offset="1" stop-color="#52B788"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9CAABA" stroke-opacity=".05"/></pattern>
    <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 18H52" stroke="#F4F1E8" stroke-width="5"/>
      <path d="M37 18V24C37 31 23 28 23 36C23 44 37 41 37 47" stroke="#F5B84B" stroke-width="5"/>
