  <text x="451" y="548" fill="#F4F1E8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="22">plan</text>
  <text x="782" y="548" fill="#F4F1E8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="22">edit</text>
