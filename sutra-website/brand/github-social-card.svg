      <circle cx="37" cy="50" r="5.5" fill="#F5B84B" stroke="none"/>
    </g>
    <g id="wordmark" fill="none" stroke="#F4F1E8" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
      <path d="M30 6H12C6 6 4 9 4 13C4 17 6 20 12 20H22C28 20 30 23 30 27C30 31 28 34 22 34H4"/>
      <path d="M44 6V25C44 31 47 34 53 34H57C63 34 66 31 66 25V6"/>
      <path d="M80 6H106M93 6V34"/>
      <path d="M120 34V6H136C142 6 144 9 144 13C144 17 142 20 136 20H120M134 20L144 34"/>
      <path d="M156 34L169 6L182 34M161 24H177"/>
    </g>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1107" cy="116" r="250" fill="#F5B84B" fill-opacity=".035"/>
  <circle cx="124" cy="576" r="310" fill="#6CA8E8" fill-opacity=".035"/>
  <rect x="88" y="86" width="110" height="110" rx="26" fill="#223240" stroke="#385061"/>
