  <use href="#wordmark" transform="translate(237 106) scale(2.13)"/>
  <text x="242" y="228" fill="#F5B84B" font-family="'Noto Sans Devanagari','Mukta',sans-serif" font-size="36" font-weight="600">सूत्र</text>
  <text x="88" y="305" fill="#F4F1E8" font-family="Inter,system-ui,sans-serif" font-size="43" font-weight="600">The thread that connects</text>
  <text x="88" y="363" fill="#F4F1E8" font-family="Inter,system-ui,sans-serif" font-size="43" font-weight="600">intelligence to action.</text>
  <text x="91" y="413" fill="#9CAABA" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="20">An open-source AI coding agent for the terminal.</text>
  <rect x="88" y="463" width="1104" height="111" rx="16" fill="#0C141D" stroke="#385061" stroke-width="1.5"/>
  <path d="M137 500H1143" stroke="url(#line)" stroke-width="3"/>
