<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Sutra mark</title>
  <!-- A headline (शिरोरेखा) joins characters in Devanagari; a thread drops from it,
       turns once like the curve of स, and ends in a node: reasoning reaching action. -->
  <rect width="64" height="64" rx="14" fill="#101923"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 18 H52" stroke="#F4F1E8" stroke-width="5"/>
    <path d="M37 18 V24 C37 31 23 28 23 36 C23 44 37 41 37 47" stroke="#F5B84B" stroke-width="5"/>
  </g>
  <circle cx="37" cy="18" r="4.5" fill="#101923" stroke="#F5B84B" stroke-width="3"/>
  <circle cx="37" cy="50" r="5.5" fill="#F5B84B"/>
</svg>
